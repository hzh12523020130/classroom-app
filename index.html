<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>课堂作业系统</title>
  <style>
    body { font-family: system-ui, "Microsoft YaHei", sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; color: #222; }
    h1 { text-align: center; }
    .switch { text-align: center; margin: 24px 0; }
    button { padding: 8px 16px; font-size: 16px; cursor: pointer; border: 1px solid #888; border-radius: 6px; background: #f5f5f5; }
    .panel { border: 1px solid #ccc; border-radius: 8px; padding: 16px; min-height: 120px; }
  </style>
</head>
<body>
  <h1>课堂作业系统</h1>
  <div class="switch">
    <button id="roleBtn">我是老师 / 我是学生</button>
  </div>
  <div class="panel" id="panel">请点击上方按钮切换身份。</div>
  <script>
    // 当前身份：true = 老师，false = 学生
    let isTeacher = false;
    const btn = document.getElementById('roleBtn');
    const panel = document.getElementById('panel');

    btn.addEventListener('click', function () {
      isTeacher = !isTeacher;
      if (isTeacher) {
        btn.textContent = '切换到学生视角';
        panel.innerHTML = '<h3>老师端</h3><p>（发布作业的功能以后在这里做）</p>';
      } else {
        btn.textContent = '切换到老师视角';
        panel.innerHTML = '<h3>学生端</h3><p>（查看 / 提交作业的功能以后在这里做）</p>';
      }
    });
  </script>
</body>
</html>
